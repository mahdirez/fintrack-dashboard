<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var t = localStorage.getItem("fintrack-theme");
        var dark = t
          ? t === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FinTrack – Personal Finance Dashboard</title>
    <meta
      name="description"
      content="Track income and expenses, set budgets and visualize your spending."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
